name: Flutter Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Workaround for flutter_webrtc extraction bug
        shell: bash
        run: |
          # Locate the flutter_webrtc directory in the pub cache (bypassing
          # the junction, which CMake/libarchive cannot write through).
          PUB_CACHE="$LOCALAPPDATA/Pub/Cache/hosted/pub.dev"
          WEBRTC=$(find "$PUB_CACHE" -maxdepth 1 -type d -name 'flutter_webrtc-*' | head -1)
          if [ -z "$WEBRTC" ]; then
            echo "::error::flutter_webrtc not found in $PUB_CACHE"
            exit 1
          fi
          echo "Real flutter_webrtc path: $WEBRTC"
          THIRD_PARTY="$WEBRTC/third_party"
          DOWNLOADS="$THIRD_PARTY/downloads"
          ZIP="$DOWNLOADS/libwebrtc-win-x64-release.zip"
          LIBWEBRTC="$THIRD_PARTY/libwebrtc"

          mkdir -p "$DOWNLOADS"

          if [ ! -f "$ZIP" ]; then
            echo "Downloading libwebrtc..."
            curl -sL "https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m144.7559.09/libwebrtc-win-x64-release.zip" -o "$ZIP"
          fi

          if [ ! -d "$LIBWEBRTC" ]; then
            echo "Pre-extracting libwebrtc to libwebrtc/ ..."
            TMP_EXTRACT="$RUNNER_TEMP/webrtc_extract"
            rm -rf "$TMP_EXTRACT"
            mkdir -p "$TMP_EXTRACT"
            unzip -q "$ZIP" -d "$TMP_EXTRACT"
            ENTRIES=$(ls "$TMP_EXTRACT")
            ENTRY_COUNT=$(echo "$ENTRIES" | wc -l)
            if [ "$ENTRY_COUNT" = "1" ] && [ -d "$TMP_EXTRACT/$ENTRIES" ]; then
              # Single top-level dir — rename it to libwebrtc (mirrors CMake logic).
              mv "$TMP_EXTRACT/$ENTRIES" "$LIBWEBRTC"
            else
              mkdir -p "$LIBWEBRTC"
              mv "$TMP_EXTRACT"/* "$LIBWEBRTC"/
            fi
            rm -rf "$TMP_EXTRACT"
          fi

          # Patch the plugin's CMakeLists.txt so CMake skips its file(ARCHIVE_EXTRACT)
          # call. The directory we just created satisfies the existence check; without
          # this, CMake's libarchive call tries to extract through the junction and fails.
          echo "Patching $THIRD_PARTY/CMakeLists.txt to skip file(ARCHIVE_EXTRACT)..."
          sed -i 's|file(ARCHIVE_EXTRACT|# file(ARCHIVE_EXTRACT|g' "$THIRD_PARTY/CMakeLists.txt"

          echo "=== third_party contents ==="
          ls -la "$THIRD_PARTY"
          echo "=== libwebrtc contents (top level) ==="
          ls -la "$LIBWEBRTC" | head -30
          if [ -d "$LIBWEBRTC/include" ]; then
            echo "=== libwebrtc/include (top 20) ==="
            ls "$LIBWEBRTC/include" | head -20
          fi
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
