name: Flutter Windows Build (Fixed)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Workaround for flutter_webrtc extraction bug on Windows
        shell: pwsh
        run: |
          $SYMLINK = "windows/flutter/ephemeral/.plugin_symlinks/flutter_webrtc"
          Remove-Item -Recurse -Force $SYMLINK
          New-Item -ItemType Directory -Force -Path $SYMLINK | Out-Null
          $PUB_CACHE = "C:\Users\runneradmin\AppData\Local\Pub\Cache\Hosted\pub.dev\flutter_webrtc-1.5.1"
          if (-not (Test-Path $PUB_CACHE)) {
            $PUB_CACHE = (Get-ChildItem "C:\Users\runneradmin\AppData\Local\Pub\Cache\Hosted\pub.dev" -Directory -Filter "flutter_webrtc-*" | Select-Object -First 1).FullName
          }
          Write-Host "Copying flutter_webrtc from $PUB_CACHE to $SYMLINK"
          Copy-Item -Path "$PUB_CACHE/*" -Destination $SYMLINK -Recurse -Force
          $THIRD_PARTY = "$SYMLINK/third_party"
          New-Item -ItemType Directory -Force -Path "$THIRD_PARTY/downloads" | Out-Null
          curl -sL https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m144.7559.09/libwebrtc-win-x64-release.zip -o "$THIRD_PARTY/downloads/libwebrtc.zip"
          Expand-Archive -Path "$THIRD_PARTY/downloads/libwebrtc.zip" -DestinationPath $THIRD_PARTY -Force
          Write-Host "Final third_party contents:"
          Get-ChildItem $THIRD_PARTY | Format-Table -AutoSize
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-fixed
          path: build/windows/x64/runner/Release/
