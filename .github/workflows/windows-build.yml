name: Flutter Windows Build (Fixed)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Clean up any previous build artifacts
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "build" -ErrorAction SilentlyContinue
      - name: Workaround for flutter_webrtc extraction bug on Windows
        shell: bash
        run: |
          pwd
          ls -la
          # Copy flutter_webrtc to build dir to avoid symlink extraction issues
          WEBRTC_SRC="windows/flutter/ephemeral/.plugin_symlinks/flutter_webrtc"
          WEBRTC_COPY="$GITHUB_WORKSPACE/build/flutter_webrtc_real"
          mkdir -p $WEBRTC_COPY
          cp -r $WEBRTC_SRC/. $WEBRTC_COPY/
          
          # Download and extract libwebrtc to the copy
          cd $WEBRTC_COPY/third_party
          mkdir -p downloads
          curl -sL https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m144.7559.09/libwebrtc-win-x64-release.zip -o downloads/libwebrtc.zip
          unzip -q downloads/libwebrtc.zip -d .
          
          # Patch generated_plugins.cmake to use our copy instead of symlink
          cd $GITHUB_WORKSPACE
          PLUGINS_FILE="windows/flutter/generated_plugins.cmake"
          # Replace the foreach block to handle flutter_webrtc separately
          cat > $PLUGINS_FILE << 'PLUGINSEOF'
#
# Generated file, do not edit.
#

list(APPEND FLUTTER_PLUGIN_LIST
  flutter_webrtc
)

list(APPEND FLUTTER_FFI_PLUGIN_LIST
  jni
)

set(PLUGIN_BUNDLED_LIBRARIES)

add_subdirectory(build/flutter_webrtc_real/windows plugins/flutter_webrtc)
target_link_libraries(${BINARY_NAME} PRIVATE flutter_webrtc_plugin)
list(APPEND PLUGIN_BUNDLED_LIBRARIES $<TARGET_FILE:flutter_webrtc_plugin>)
list(APPEND PLUGIN_BUNDLED_LIBRARIES ${flutter_webrtc_bundled_libraries})

foreach(plugin flutter_webrtc)
  if(plugin STREQUAL "flutter_webrtc")
    continue()
  endif()
  add_subdirectory(flutter/ephemeral/.plugin_symlinks/${plugin}/windows plugins/${plugin})
  target_link_libraries(${BINARY_NAME} PRIVATE ${plugin}_plugin)
  list(APPEND PLUGIN_BUNDLED_LIBRARIES $<TARGET_FILE:${plugin}_plugin>)
  list(APPEND PLUTTER_BUNDLED_LIBRARIES ${${plugin}_bundled_libraries})
endforeach(plugin)

foreach(ffi_plugin ${FLUTTER_FFI_PLUGIN_LIST})
  add_subdirectory(flutter/ephemeral/.plugin_symlinks/${ffi_plugin}/windows plugins/${ffi_plugin})
  list(APPEND PLUGIN_BUNDLED_LIBRARIES ${${ffi_plugin}_bundled_libraries})
endforeach(ffi_plugin)
PLUGINSEOF
          echo "=== Patched file ==="
          cat $PLUGINS_FILE
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-fixed
          path: build/windows/x64/runner/Release/
