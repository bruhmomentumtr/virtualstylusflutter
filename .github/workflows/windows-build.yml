name: Flutter Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Workaround for flutter_webrtc extraction bug
        shell: pwsh
        run: |
          # Bypass the junction and locate flutter_webrtc directly in the pub
          # cache. Writing through the junction has proven unreliable, so we
          # do everything in the real cache directory and let the junction
          # pick up the resulting files.
          $pubCache = Join-Path $env:LOCALAPPDATA "Pub\Cache\hosted\pub.dev"
          $webRtc = Get-ChildItem $pubCache -Directory -Filter "flutter_webrtc-*" | Select-Object -First 1
          if (-not $webRtc) {
            throw "flutter_webrtc not found in $pubCache"
          }
          Write-Host "Real path: $($webRtc.FullName)"

          $thirdParty = Join-Path $webRtc.FullName "third_party"
          $downloadsDir = Join-Path $thirdParty "downloads"
          $zipPath = Join-Path $downloadsDir "libwebrtc-win-x64-release.zip"
          $libwebrtcDir = Join-Path $thirdParty "libwebrtc"

          # Verify we can write to the pub cache.
          $writeTest = Join-Path $thirdParty "_writetest.tmp"
          "ok" | Out-File $writeTest -Encoding ascii
          if (-not (Test-Path $writeTest)) {
            throw "Cannot write to pub cache at $thirdParty"
          }
          Remove-Item $writeTest

          New-Item -ItemType Directory -Force -Path $downloadsDir | Out-Null

          if (-not (Test-Path $zipPath)) {
            Write-Host "Downloading libwebrtc..."
            Invoke-WebRequest -Uri "https://github.com/webrtc-sdk/libwebrtc/releases/download/libwebrtc.m144.7559.09/libwebrtc-win-x64-release.zip" -OutFile $zipPath
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          $topLevel = @{}
          foreach ($e in $zip.Entries) {
            $first = ($e.FullName -split '/')[0]
            $topLevel[$first] = $true
          }
          $zip.Dispose()
          Write-Host "=== Zip top-level entries ==="
          $topLevel.Keys | ForEach-Object { Write-Host "  $_" }

          if (-not (Test-Path $libwebrtcDir)) {
            Write-Host "Pre-extracting libwebrtc to libwebrtc/ ..."
            $tempExtract = Join-Path $thirdParty ".extract_tmp"
            if (Test-Path $tempExtract) { Remove-Item -Recurse -Force $tempExtract }
            New-Item -ItemType Directory -Force -Path $tempExtract | Out-Null
            Expand-Archive -Path $zipPath -DestinationPath $tempExtract
            $entries = Get-ChildItem $tempExtract
            if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) {
              Rename-Item -Path (Join-Path $tempExtract $entries[0].Name) -NewName "libwebrtc"
            } else {
              New-Item -ItemType Directory -Force -Path $libwebrtcDir | Out-Null
              Get-ChildItem $tempExtract | Move-Item -Destination $libwebrtcDir
            }
            if (Test-Path $tempExtract) { Remove-Item -Recurse -Force $tempExtract }
          }

          Write-Host "=== third_party contents ==="
          Get-ChildItem $thirdParty | Format-Table -AutoSize
          if (Test-Path $libwebrtcDir) {
            Write-Host "=== libwebrtc contents ==="
            Get-ChildItem $libwebrtcDir | Format-Table -AutoSize
            if (Test-Path (Join-Path $libwebrtcDir "include")) {
              Write-Host "=== libwebrtc/include (first 20) ==="
              Get-ChildItem (Join-Path $libwebrtcDir "include") | Select-Object -First 20 | Format-Table -AutoSize
            }
          }
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
